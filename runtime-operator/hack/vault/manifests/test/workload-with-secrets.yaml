apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: config-echo-workload
  namespace: wasmcloud-system
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: config-echo.localhost.direct:8000

        - namespace: wasi
          package: config
          version: 0.2.0-rc.1
          interfaces:
            - store

      components:
        - name: config-echo
          image: ghcr.io/aditya1404sal/components/config-echo:latest
          poolSize: 1
          maxInvocations: 100
          localResources:
            environment:
              secretFrom:
                - name: mcp-jwt-credentials
              configFrom:
                - name: mcp-servers-config
              config:
                LOG_LEVEL: "debug"
