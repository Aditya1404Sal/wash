[package]
name = "config-update-test"
edition = "2021"
version = "0.1.0"

[workspace]

[dependencies]
kube = { version = "0.99", features = ["client", "runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
base64 = "0.22"
