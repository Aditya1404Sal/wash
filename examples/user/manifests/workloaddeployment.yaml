# Example: Workload-level path routing
#
# This workload has a single component that handles /user/{server-id} requests.
# The path config is on the workload-level hostInterfaces.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: user-workload
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      components:
        - name: user
          image: ghcr.io/wasmcloud/examples/user:0.1.0
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            path: "/user/{server-id}"
